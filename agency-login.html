<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<title>Agency Access | Call Hammer Leads</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f9fafb;font:15px/1.5 Inter,system-ui,sans-serif;color:#1f2937}.panel{width:100%;max-width:450px;background:#fff;border:1px solid #e5e7eb;border-radius:20px;padding:36px;box-shadow:0 15px 50px #11182708}.mark{display:inline-block;background:#fbbf24;border-radius:10px;padding:10px 12px;font-weight:800;color:#111827}h1{font-size:30px;margin:18px 0 6px;letter-spacing:-.7px}p{color:#6b7280;margin:0 0 24px}label{display:block;font-weight:600;font-size:13px;margin:16px 0 7px}input{font:inherit;width:100%;padding:12px 14px;border:1px solid #d1d5db;border-radius:10px}button{font:inherit;font-weight:700;width:100%;margin-top:24px;padding:13px;background:#fbbf24;color:#111827;border:0;border-radius:10px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}input:focus,button:focus,a:focus{outline:2px solid #b45309;outline-offset:3px}.scope{font-size:13px;padding:14px;background:#f9fafb;border:1px solid #e5e7eb;border-radius:10px;margin:24px 0}.notice{font-size:13px;padding:12px;border-radius:9px;border:1px solid #fcd34d;background:#fffbeb;color:#92400e;margin-top:16px}[hidden]{display:none!important}.footer{font-size:12px;color:#6b7280;text-align:center;margin:22px 0 0}.footer a{color:#374151} .status{font-size:13px;color:#6b7280;margin:14px 0 0}
</style>
</head>
<body><main class="panel">
<span class="mark" aria-hidden="true">CH</span><h1>Agency Access</h1><p>Call Hammer Leads · External agency portal</p>
<form id="agency-login-form"><label for="agency-email">Agency login email</label><input id="agency-email" type="email" autocomplete="username" required maxlength="254"><label for="agency-password">Password</label><input id="agency-password" type="password" autocomplete="current-password" required><button id="agency-sign-in" type="submit">Sign in to Agency Access</button></form>
<div id="agency-login-message" class="notice" role="alert" hidden></div>
<div class="scope"><strong>Submit Lead</strong> — client calendars and booking forms.<br><strong>Lead Tracker</strong> — your agency’s submitted leads and statuses.</div>
<p class="status">An agency account must be assigned by your CHL administrator. A staff account does not grant Agency Access.</p>
<p class="footer"><a href="index.html">Staff sign-in</a></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
'use strict';
const form=document.getElementById('agency-login-form'),button=document.getElementById('agency-sign-in'),notice=document.getElementById('agency-login-message');
function message(text){notice.textContent=text;notice.hidden=!text;}
if(!window.supabase){button.disabled=true;message('The sign-in service could not be loaded. Reload this page to retry.');return;}
const client=window.supabase.createClient('https://api.supabase.callhammerleads.com','eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJzdXBhYmFzZSIsImlhdCI6MTc3MTcwMjI2MCwiZXhwIjo0OTI3Mzc1ODYwLCJyb2xlIjoiYW5vbiJ9.XuWCdGs0XSSSlWhsF6gR4gHMp50C-v6xra9ABgSVRoU');
form.addEventListener('submit',async function(event){
 event.preventDefault();if(button.disabled)return;button.disabled=true;button.textContent='Checking agency access…';message('');
 try{
  const result=await client.auth.signInWithPassword({email:document.getElementById('agency-email').value.trim().toLowerCase(),password:document.getElementById('agency-password').value});
  if(result.error||!result.data?.user){message('Unable to sign in. Check your email and password, or contact your CHL administrator.');return;}
  const membership=await client.rpc('get_my_agency_session').single();
  if(membership.error||membership.data?.auth_user_id!==result.data.user.id||membership.data?.role!=='agency'||membership.data?.is_active!==true){
   await client.auth.signOut({scope:'local'});try{localStorage.removeItem('ch_session');}catch(_){}
   message('Agency Access is not activated for this account. Please contact your CHL administrator.');return;
  }
  window.location.replace('agency-access.html#submitlead');
 }catch(_){message('The sign-in service is unavailable. Please retry.');}
 finally{document.getElementById('agency-password').value='';button.disabled=false;button.textContent='Sign in to Agency Access';}
});
})();
</script></body></html>
