<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>CHL read-only connection check</title><style>body{font:15px/1.5 system-ui;max-width:900px;margin:40px auto;padding:24px;color:#1f2937}textarea{width:100%;height:360px;font:12px/1.5 monospace}button{padding:12px 18px;font:inherit;margin-top:16px}p{max-width:75ch}</style></head><body><h1>Old Supabase · read-only connection check</h1><p>This maintenance page sends one read-only metadata query to the existing Supabase Studio API. Supabase still controls authorization. It does not create accounts, alter permissions, submit leads, or display passwords or tokens.</p><form method="post" enctype="application/x-www-form-urlencoded" action="https://supabase.callhammerleads.com/api/platform/pg-meta/default/query"><label for="query">Exact read-only query</label><textarea id="query" name="query" readonly spellcheck="false">BEGIN READ ONLY;
SELECT jsonb_build_object(
'database',current_database(),'db_user',current_user,'version',current_setting('server_version'),
'default_organization',public.default_organization_id(),
'role_config',(SELECT jsonb_agg(jsonb_build_object('role',r.rolname,'setting',s)) FROM pg_roles r CROSS JOIN LATERAL unnest(r.rolconfig) s WHERE r.rolname='authenticator' AND (s LIKE 'pgrst.db_pre_request=%' OR s LIKE 'pgrst.db_schemas=%')),
'functions',(SELECT jsonb_agg(jsonb_build_object('name',p.proname,'args',pg_get_function_identity_arguments(p.oid),'definer',p.prosecdef,'acl',p.proacl)) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND (p.proname ILIKE '%agency%' OR p.proname ILIKE '%submit%lead%' OR p.proname ILIKE '%book%appointment%' OR p.proname='get_my_agent_leads')),
'auth_triggers',(SELECT jsonb_agg(jsonb_build_object('trigger',pg_get_triggerdef(t.oid),'function',t.tgfoid::regprocedure::text)) FROM pg_trigger t WHERE t.tgrelid='auth.users'::regclass AND NOT t.tgisinternal),
'lead_triggers',(SELECT jsonb_agg(jsonb_build_object('trigger',pg_get_triggerdef(t.oid),'function',t.tgfoid::regprocedure::text)) FROM pg_trigger t WHERE t.tgrelid='public.leads_raw'::regclass AND NOT t.tgisinternal),
'route_orgs',(SELECT jsonb_agg(x) FROM (SELECT organization_id,count(*) AS active_routes FROM public.client_submission_routes WHERE is_active=true GROUP BY organization_id) x),
'agency_role_exists',EXISTS(SELECT 1 FROM pg_roles WHERE rolname='chl_agency'),
'extensions',(SELECT jsonb_agg(extname) FROM pg_extension WHERE extname IN ('pgcrypto','http','pg_net'))
) AS agency_connection_check;
COMMIT;</textarea><br><button type="submit">Run read-only connection check</button></form></body></html>
