name: Revert payroll roster fallback

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  revert-roster-fallback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore payroll dashboard before roster fallback
        run: |
          git checkout dd026f8b43f2b01e5a136e1037bd9e8d59a5983b -- admin-dashboard.html
          rm .github/workflows/revert-payroll-roster-fallback.yml
          git config user.name "CHL Payroll Repair"
          git config user.email "actions@users.noreply.github.com"
          git add admin-dashboard.html .github/workflows/revert-payroll-roster-fallback.yml
          git commit -m "Revert payroll roster fallback"
          git push origin main
