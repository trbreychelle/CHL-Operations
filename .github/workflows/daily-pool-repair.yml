name: Apply daily client pool repair
on:
  push:
    branches: [fix/daily-client-pool-20261014]
    paths: ['tools/apply-daily-client-pool.py', 'tests/daily-client-pool.test.cjs', '.github/workflows/daily-pool-repair.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.repository == 'trbreychelle/CHL-Operations' && github.ref == 'refs/heads/fix/daily-client-pool-20261014'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded patch
        run: python3 tools/apply-daily-client-pool.py
      - name: Confirm patch is idempotent
        run: |
          sha256sum admin-dashboard.html > /tmp/admin-before.sha256
          python3 tools/apply-daily-client-pool.py
          sha256sum --check /tmp/admin-before.sha256
      - name: Run all existing and new regression tests
        run: node --test tests/*.test.cjs
      - name: Commit only the tested dashboard change
        run: |
          if git diff --quiet -- admin-dashboard.html; then exit 0; fi
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- admin-dashboard.html
          git commit -m 'Fix legacy client status resolution and daily pool package filtering'
          git push origin HEAD:refs/heads/fix/daily-client-pool-20261014
