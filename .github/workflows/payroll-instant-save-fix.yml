name: One-time payroll instant-save repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-payroll-instant-save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch payroll mutation UX
        run: python .github/scripts/payroll_instant_fix.py

      - name: Verify payroll instant-save markers
        shell: bash
        run: |
          grep -q "applyPayrollOptimisticPatch(weekId, workerId, patch = {})" admin-dashboard.html
          grep -q "applyPendingPayrollPatches(payrollRows)" admin-dashboard.html
          grep -q "schedulePayrollReconcile()" admin-dashboard.html

      - name: Remove one-time repair files
        run: |
          rm .github/workflows/payroll-instant-save-fix.yml
          rm .github/scripts/payroll_instant_fix.py

      - name: Commit payroll instant-save fix
        shell: bash
        run: |
          git config user.name "CHL Payroll Repair"
          git config user.email "actions@users.noreply.github.com"
          git add admin-dashboard.html .github/workflows/payroll-instant-save-fix.yml .github/scripts/payroll_instant_fix.py
          git commit -m "Make payroll edits update instantly"
          git push origin main
