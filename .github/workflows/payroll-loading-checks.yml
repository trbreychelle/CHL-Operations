name: Payroll loading checks
on:
  push:
    branches: [main, fix/payroll-loading-20261012]
    paths: [admin-dashboard.html, main.js, 'tests/**', '.github/workflows/payroll-loading-checks.yml']
  pull_request:
    paths: [admin-dashboard.html, main.js, 'tests/**', '.github/workflows/payroll-loading-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run portal and payroll loading regressions
        run: node --test tests/*.test.cjs
