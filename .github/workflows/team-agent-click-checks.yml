name: Team clicks and weekly performance checks
on:
  push:
    branches: [main, fix/team-agent-quoted-names-20261016, fix/team-weekly-first-week-20261016]
    paths: [admin-dashboard.html, 'tests/browser/**', '.github/workflows/team-agent-click-checks.yml']
  pull_request:
    paths: [admin-dashboard.html, 'tests/browser/**', '.github/workflows/team-agent-click-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated DOM test dependencies
        run: npm install --prefix "$RUNNER_TEMP/team-agent-test-deps" --ignore-scripts --no-audit --no-fund acorn@8.14.1 jsdom@24.1.3
      - name: Test Team names, weekly rows, and lead details
        env:
          NODE_PATH: ${{ runner.temp }}/team-agent-test-deps/node_modules
        run: |
          TZ=UTC node --test tests/browser/*.test.cjs
          TZ=America/New_York node --test tests/browser/team-weekly-performance.test.cjs
          TZ=Asia/Manila node --test tests/browser/team-weekly-performance.test.cjs
      - name: Verify deployed weekly performance code with synthetic records
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/team-agent-test-deps/node_modules
          TZ: UTC
        run: |
          # Read only public static HTML. Test data stays in an isolated DOM;
          # these tests never log in or fetch/mutate production lead records.
          live_html="$RUNNER_TEMP/team-live-dashboard.html"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 20 \
              "https://dashboard.callhammerleads.com/admin-dashboard.html?team-weekly-check=$GITHUB_SHA-$attempt" \
              --output "$live_html" && \
              grep -Fq 'const safeName = escapeAgentHtml(JSON.stringify(String(r.name ?? "")));' "$live_html" && \
              grep -Fq 'let cursor = getSaturdayOnOrBefore(activeStart);' "$live_html"; then
              TEAM_DASHBOARD_HTML="$live_html" node --test tests/browser/*.test.cjs
              echo 'Verified name -> weekly rows -> lead details against the deployed dashboard code with synthetic records.'
              exit 0
            fi
            echo "Waiting for static-site deployment (attempt $attempt/18)."
            sleep 10
          done
          echo 'The repository is corrected, but the deployed HTML has not updated yet.'
          exit 1
