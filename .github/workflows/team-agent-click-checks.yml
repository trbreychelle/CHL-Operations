name: Team agent click checks
on:
  push:
    branches: [main, fix/team-agent-quoted-names-20261016]
    paths: [admin-dashboard.html, 'tests/browser/**', '.github/workflows/team-agent-click-checks.yml']
  pull_request:
    paths: [admin-dashboard.html, 'tests/browser/**', '.github/workflows/team-agent-click-checks.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated DOM test dependencies
        run: npm install --prefix "$RUNNER_TEMP/team-agent-test-deps" --ignore-scripts --no-audit --no-fund acorn@8.14.1 jsdom@24.1.3
      - name: Test Team name and lead-count buttons
        env:
          NODE_PATH: ${{ runner.temp }}/team-agent-test-deps/node_modules
        run: node --test tests/browser/team-agent-name-clicks.test.cjs
      - name: Verify the deployed dashboard serves the corrected handlers
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/team-agent-test-deps/node_modules
        run: |
          # Read only the public static HTML, never authenticated lead records.
          live_html="$RUNNER_TEMP/team-live-dashboard.html"
          for attempt in $(seq 1 18); do
            if curl --fail --silent --show-error --location --max-time 20 \
              "https://dashboard.callhammerleads.com/admin-dashboard.html?team-click-check=$GITHUB_SHA-$attempt" \
              --output "$live_html" && \
              grep -Fq 'const safeName = escapeAgentHtml(JSON.stringify(String(r.name ?? "")));' "$live_html"; then
              TEAM_DASHBOARD_HTML="$live_html" node --test tests/browser/team-agent-name-clicks.test.cjs
              echo 'Verified corrected Team click handlers in the deployed dashboard HTML.'
              exit 0
            fi
            echo "Waiting for static-site deployment (attempt $attempt/18)."
            sleep 10
          done
          echo 'The repository is corrected, but the deployed HTML has not updated yet.'
          exit 1
