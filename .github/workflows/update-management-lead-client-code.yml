name: Finalize Management lead review client code

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-management-lead-client-code.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make Management detection page-safe
        run: |
          python - <<'PY'
          from pathlib import Path

          js_path = Path('leads-review-modal.js')
          source = js_path.read_text(encoding='utf-8')

          old_detection = "    return role === 'management' || /management-dashboard\\\\.html$/i.test(window.location.pathname);"
          new_detection = "    return role.includes('management') || /management-dashboard\\.html$/i.test(window.location.pathname);"

          count = source.count(old_detection)
          if count != 1:
              raise SystemExit(f'Expected one Management detection line, found {count}.')
          js_path.write_text(source.replace(old_detection, new_detection, 1), encoding='utf-8')

          old_version = 'leads-review-modal.js?v=20260825-4'
          new_version = 'leads-review-modal.js?v=20260825-5'
          for dashboard_name in ('admin-dashboard.html', 'management-dashboard.html'):
              dashboard_path = Path(dashboard_name)
              dashboard = dashboard_path.read_text(encoding='utf-8')
              count = dashboard.count(old_version)
              if count != 1:
                  raise SystemExit(
                      f'Expected one {old_version!r} include in {dashboard_name}; found {count}.'
                  )
              dashboard_path.write_text(
                  dashboard.replace(old_version, new_version, 1),
                  encoding='utf-8',
              )
          PY

      - name: Validate final Management behavior
        run: |
          node --check leads-review-modal.js
          python - <<'PY'
          from pathlib import Path

          js = Path('leads-review-modal.js').read_text(encoding='utf-8')
          assert "return role.includes('management') || /management-dashboard\\.html$/i.test(window.location.pathname);" in js
          assert "managementAccess ? 'Client Code' : 'Roofing Company'" in js
          assert "managementAccess ? fieldValue(lead, 'client_code') : fieldValue(lead, 'company_name')" in js

          for name in ('admin-dashboard.html', 'management-dashboard.html'):
              html = Path(name).read_text(encoding='utf-8')
              assert html.count('leads-review-modal.js?v=20260825-5') == 1
          PY

      - name: Commit final Management modal correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leads-review-modal.js admin-dashboard.html management-dashboard.html
          git commit -m "fix: guarantee Client Code on Management lead review"
          git push origin HEAD:main
