name: Apply Leads Tracker review modal

on:
  push:
    branches:
      - feat/leads-review-modal
    paths:
      - .github/workflows/apply-leads-review-modal.yml
      - leads-review-modal.js
      - admin-dashboard.html
      - management-dashboard.html
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/leads-review-modal
          fetch-depth: 0

      - name: Validate modal JavaScript
        run: |
          node --check leads-review-modal.js
          node <<'NODE'
          const fs = require('fs');
          const source = fs.readFileSync('leads-review-modal.js', 'utf8');
          const required = [
            'homeowner_names',
            'email_of_homeowner',
            'homeowner_phone_numbers',
            'appointment_date_time',
            'address',
            'age_of_roof',
            'insurance_company',
            'additional_notes'
          ];
          for (const field of required) {
            if (!source.includes(field)) throw new Error(`Missing required review field: ${field}`);
          }
          if (!source.includes("data-lead-review-edit")) throw new Error('Missing pencil edit action');
          if (!source.includes("feedback_highlight")) throw new Error('Missing Spotlight feedback support');
          if (!source.includes("status.disabled = !unlocked")) throw new Error('Missing status review gate');
          NODE

      - name: Load shared modal from both dashboards
        run: |
          python <<'PY'
          from pathlib import Path

          tag = '<script src="leads-review-modal.js?v=20260825-1"></script>'
          for filename in ('admin-dashboard.html', 'management-dashboard.html'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if tag not in text:
                  if '</body>' not in text:
                      raise SystemExit(f'{filename}: closing body tag not found')
                  before, after = text.rsplit('</body>', 1)
                  text = before.rstrip() + '\n' + tag + '\n</body>' + after
                  path.write_text(text, encoding='utf-8')

              updated = path.read_text(encoding='utf-8')
              if updated.count(tag) != 1:
                  raise SystemExit(f'{filename}: expected exactly one modal script include')
          PY

      - name: Verify repository diff
        run: |
          git diff --check
          grep -n 'leads-review-modal.js' admin-dashboard.html management-dashboard.html

      - name: Commit dashboard wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-dashboard.html management-dashboard.html
          if ! git diff --cached --quiet; then
            git commit -m "feat: enable gated lead review modal in admin and management"
            git push origin HEAD:feat/leads-review-modal
          fi
