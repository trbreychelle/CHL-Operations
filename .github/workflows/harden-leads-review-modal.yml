name: Harden Leads review modal fallbacks

on:
  push:
    branches:
      - feat/leads-review-modal
    paths:
      - .github/workflows/harden-leads-review-modal.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/leads-review-modal
          fetch-depth: 0

      - name: Preserve fallback values when the first alias is blank
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('leads-review-modal.js')
          text = path.read_text(encoding='utf-8')
          old = "if (value !== undefined && value !== null) return value;"
          new = "if (value !== undefined && value !== null && String(value).trim() !== '') return value;"
          if old not in text and new not in text:
              raise SystemExit('Expected pick() line was not found')
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          node --check leads-review-modal.js
          grep -n "String(value).trim()" leads-review-modal.js

      - name: Commit hardening change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leads-review-modal.js
          if ! git diff --cached --quiet; then
            git commit -m "fix: preserve alternate lead field values in review modal"
            git push origin HEAD:feat/leads-review-modal
          fi
