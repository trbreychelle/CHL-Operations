name: One-time Shady auto-bonus exception

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-shady-bonus:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Shady Magdy auto bonus for Aug 22 week
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('admin-dashboard.html')
          text = path.read_text(encoding='utf-8')

          old = '''  const creditedLeads = Math.max(totalLeads - approvedLeads - rejectedLeads, 0);\n  const autoBonus = this.calculateTieredBonus(approvedLeads, creditedLeads);\n  const cxPercent = (approvedLeads + creditedLeads) > 0'''

          new = '''  const creditedLeads = Math.max(totalLeads - approvedLeads - rejectedLeads, 0);\n\n  // One-week payroll exception: Shady Magdy's Aug 22-28, 2026\n  // incentive is entered manually, so suppress the automatic tier bonus\n  // without changing his lead counts or any other payroll week.\n  const suppressAutoBonus =\n    agName.toLowerCase() === "shady magdy" &&\n    String(r.week_start || "") === "2026-08-22";\n\n  const autoBonus = suppressAutoBonus\n    ? 0\n    : this.calculateTieredBonus(approvedLeads, creditedLeads);\n\n  const cxPercent = (approvedLeads + creditedLeads) > 0'''

          if old not in text:
              raise SystemExit('Expected auto bonus calculation block was not found')

          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          print('Shady Magdy one-week auto bonus exception added.')
          PY

      - name: Verify exception
        run: |
          grep -q 'shady magdy' admin-dashboard.html
          grep -q '2026-08-22' admin-dashboard.html
          grep -q 'suppressAutoBonus' admin-dashboard.html

      - name: Remove one-time workflow
        run: rm .github/workflows/shady-bonus-exception.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "CHL Payroll Repair"
          git config user.email "actions@users.noreply.github.com"
          git add admin-dashboard.html .github/workflows/shady-bonus-exception.yml
          git commit -m "Suppress Shady Magdy auto bonus for Aug 22 week"
          git push origin main
