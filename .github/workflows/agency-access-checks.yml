name: Agency Access checks
on:
  push:
    branches: [main, feature/agency-access-20261005]
  pull_request:
    paths: ['agency-access.*', 'agency-login.html', 'main.js', 'tests/agency-*.test.cjs', 'AGENCY_ACCESS.md', '.github/workflows/agency-access-checks.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate source, sign-in, and agency routing
        run: |
          node --check main.js
          node --check agency-access.js
          node --test tests/agency-*.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: agency-access-source
          retention-days: 3
          path: |
            main.js
            agency-access.html
            agency-access.js
            agency-login.html
            tools/apply-agency-routing.py
            tests/agency-*.test.cjs
            AGENCY_ACCESS.md
