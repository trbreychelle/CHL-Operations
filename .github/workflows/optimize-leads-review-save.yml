name: Optimize Leads review save

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/optimize-leads-review-save.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Make lead saves return immediately after the database write
        run: |
          python - <<'PY'
          import base64
          import zlib
          from pathlib import Path

          js_path = Path('leads-review-modal.js')
          source = js_path.read_text(encoding='utf-8')
          start_marker = "      const { data, error } = await client\n"
          end_marker = "    } catch (error) {\n      console.error('Lead review save failed:', error);"
          start = source.find(start_marker)
          end = source.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit('Could not locate the Leads review save success block.')
          if source.find(start_marker, start + 1) >= 0:
              raise SystemExit('Found more than one Leads review save query block.')

          encoded = ""
          optimized = zlib.decompress(base64.b64decode(encoded)).decode('utf-8')
          js_path.write_text(source[:start] + optimized + source[end:], encoding='utf-8')

          old_version = 'leads-review-modal.js?v=20260825-2'
          new_version = 'leads-review-modal.js?v=20260825-3'
          for dashboard_name in ('admin-dashboard.html', 'management-dashboard.html'):
              dashboard_path = Path(dashboard_name)
              dashboard = dashboard_path.read_text(encoding='utf-8')
              count = dashboard.count(old_version)
              if count != 1:
                  raise SystemExit(f'Expected one old script include in {dashboard_name}; found {count}.')
              dashboard_path.write_text(dashboard.replace(old_version, new_version, 1), encoding='utf-8')
          PY

      - name: Validate optimized save flow
        run: |
          node --check leads-review-modal.js
          python - <<'PY'
          from pathlib import Path
          js = Path('leads-review-modal.js').read_text(encoding='utf-8')
          save_start = js.index('  async function saveLeadReview()')
          save_end = js.index('  function decorateRenderedLeads', save_start)
          save = js[save_start:save_end]
          assert ".update(updatePayload)\n        .eq('lead_id', leadId);" in save
          assert ".select('*')" not in save
          assert 'await window.portal?.createCommandCenterEvent' not in save
          assert 'await window.portal.fetchAdminData' not in save
          assert 'await admin.applyLeadsFilters' not in save
          assert "Promise.resolve(latestAdmin.applyLeadsFilters" in save
          for name in ('admin-dashboard.html', 'management-dashboard.html'):
              html = Path(name).read_text(encoding='utf-8')
              assert html.count('leads-review-modal.js?v=20260825-3') == 1
          PY

      - name: Commit performance fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leads-review-modal.js admin-dashboard.html management-dashboard.html
          git commit -m "perf: make Leads review saves update immediately"
          git push origin HEAD:main
