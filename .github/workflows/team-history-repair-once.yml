name: Repair earlier Team lead history
on:
  push:
    branches: [fix/team-history-before-active-20261016]
    paths: ['.github/workflows/team-history-repair-once.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/team-history-before-active-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated DOM test dependencies
        run: npm install --prefix "$RUNNER_TEMP/team-agent-test-deps" --ignore-scripts --no-audit --no-fund acorn@8.14.1 jsdom@24.1.3
      - name: Add regression cases for recorded leads before activation
        run: |
          cat >> tests/browser/team-weekly-performance.test.cjs <<'JS'

          // Earlier working/training weeks are part of lead history even when HR
          // activation happened later. These are synthetic records, not live data.
          function recordedHistoryLeads() {
            return [
              ...Array.from({ length: 6 }, (_, i) => lead(`earlier-${i + 1}`,
                i < 4 ? 'Confirmed' : 'Rejected', '2026-10-09T12:00:00')),
              ...Array.from({ length: 12 }, (_, i) => lead(`later-${i + 1}`,
                i < 11 ? 'Confirmed' : 'Rejected', '2026-10-16T12:00:00'))
            ];
          }
          function assertRecordedHistory(f) {
            const weeks = f.weeks();
            assert.equal(weeks.length, 2, 'Recorded history must include October 3-9, not just the activation week');
            assert.deepEqual(weeks.map(w => w.weekNumber), [2, 1]);
            assert.deepEqual(weeks.map(w => localDate(w.start)), ['2026-10-10', '2026-10-03']);
            assert.deepEqual(weeks.map(w => localDate(w.end)), ['2026-10-16', '2026-10-09']);
            assert.deepEqual(weeks.map(w => [w.total, w.rejected, w.qualified, w.credited]), [[12, 1, 11, 0], [6, 2, 4, 0]]);
            assert.equal(weeks.reduce((sum, w) => sum + w.total, 0), 18);
            const earlier = f.metric('total', 1);
            assert.equal(earlier.length, 6);
            assert.ok(earlier.every(row => row.textContent.includes('Synthetic earlier-')));
            assert.equal(f.metric('rejected', 1).length, 2);
            assert.equal(f.metric('qualified', 1).length, 4);
            assert.equal(f.metric('credited', 1).length, 0);
            const later = f.metric('total', 0);
            assert.equal(later.length, 12);
            assert.ok(later.every(row => row.textContent.includes('Synthetic later-')));
            assert.equal(f.metric('rejected', 0).length, 1);
            assert.equal(f.metric('qualified', 0).length, 11);
            assert.equal(f.metric('credited', 0).length, 0);
          }

          for (const dates of [
            { start_date: '2026-10-05', active_start_date: '2026-10-12' },
            { start_date: null, active_start_date: '2026-10-12' },
            { start_date: '2026-10-12', active_start_date: '2026-10-12' },
            { start_date: null, active_start_date: null },
            { start_date: null, active_start_date: 'not-a-date' },
            { start_date: null, active_start_date: '2026-10-19' }
          ]) {
            test(`Recorded history: both weeks survive later or unusable HR dates ${JSON.stringify(dates)}`, () => {
              const f = fixture({ agents: [agent(dates)], leads: recordedHistoryLeads(),
                selectedWeek: '2026-10-03|2026-10-09' });
              try {
                f.clickName();
                // Match the actual Team table for each period, not just modal totals.
                assert.deepEqual([...f.document.querySelectorAll('#team-body tr:first-child td')]
                  .slice(1, 5).map(td => Number(td.textContent.trim())), [6, 2, 4, 0]);
                assertRecordedHistory(f);
                f.Admin.closeAgentModal();
                f.Admin._teamSelectedWeek = '2026-10-10|2026-10-16';
                f.clickName();
                assert.deepEqual([...f.document.querySelectorAll('#team-body tr:first-child td')]
                  .slice(1, 5).map(td => Number(td.textContent.trim())), [12, 1, 11, 0]);
                assertRecordedHistory(f);
              } finally { f.close(); }
            });
          }

          test('Recorded history: an earlier start date preserves a zero-lead first week', () => {
            const f = fixture({ agents: [agent({ start_date: '2026-10-05' })], leads: [lead('current')] });
            try {
              f.clickName();
              assert.deepEqual(f.weeks().map(w => w.weekNumber), [2, 1]);
              assert.deepEqual(f.weeks().map(w => w.total), [1, 0]);
              assert.equal(localDate(f.weeks()[1].start), '2026-10-03');
              assert.equal(f.metric('total', 1).length, 0);
            } finally { f.close(); }
          });

          test('Recorded history: other agents and invalid or future lead dates cannot move the beginning', () => {
            const f = fixture({ leads: [lead('current'),
              lead('other-history', 'Confirmed', '2026-09-01T12:00:00', {
                appointment_coordinator_name: 'Another Agent', agent_email: 'another@example.test'
              }),
              lead('invalid-date', 'Confirmed', 'not-a-date'),
              lead('future-date', 'Confirmed', '2026-11-20T12:00:00')
            ] });
            try {
              f.clickName();
              assert.equal(f.weeks().length, 1);
              assert.equal(f.weeks()[0].total, 1);
              assert.equal(localDate(f.weeks()[0].start), '2026-10-10');
              assert.equal(f.metric('total').length, 1);
            } finally { f.close(); }
          });

          test('Recorded history: the same official-name resolver as Team includes historical nicknames', () => {
            const leads = recordedHistoryLeads().map(l => l.id.startsWith('earlier-')
              ? { ...l, appointment_coordinator_name: 'Jimmy', agent_email: '' } : l);
            const f = fixture({ leads, selectedWeek: '2026-10-03|2026-10-09' });
            try {
              f.clickName();
              assert.equal(Number(f.document.querySelector('#team-body tr td:nth-child(2)').textContent.trim()), 6);
              assertRecordedHistory(f);
            } finally { f.close(); }
          });

          for (const field of ['appointment_coordinator_name', 'Appointment Coordinator Name', 'agent_name', 'Agent Name', 'AGENT']) {
            test(`Recorded history: historical lead name field ${field} is consistent with Team`, () => {
              const earlier = lead('earlier-field', 'Confirmed', '2026-10-09T12:00:00', {
                appointment_coordinator_name: '', agent_email: '', [field]: NAME
              });
              const f = fixture({ leads: [earlier, lead('current')] });
              try {
                f.clickName();
                assert.deepEqual(f.weeks().map(w => w.total), [1, 1]);
                assert.match(f.metric('total', 1)[0].textContent, /Synthetic earlier-field/);
              } finally { f.close(); }
            });
          }

          test('Recorded history: matching email retains old-name records and calendar gaps', () => {
            const f = fixture({ leads: [
              lead('old-name', 'Confirmed', '2026-09-25T12:00:00', {
                appointment_coordinator_name: 'Former display name', agent_email: EMAIL.toUpperCase()
              }), lead('current')
            ] });
            try {
              f.clickName();
              assert.deepEqual(f.weeks().map(w => localDate(w.start)), ['2026-10-10', '2026-10-03', '2026-09-26', '2026-09-19']);
              assert.deepEqual(f.weeks().map(w => w.total), [1, 0, 0, 1]);
              assert.match(f.metric('total', 3)[0].textContent, /Synthetic old-name/);
            } finally { f.close(); }
          });

          test('Recorded history: an earlier valid activation date is not lost to a later start_date', () => {
            const f = fixture({ agents: [agent({ start_date: '2026-10-12', active_start_date: '2026-10-05' })], leads: [lead('current')] });
            try {
              f.clickName();
              assert.deepEqual(f.weeks().map(w => w.total), [1, 0]);
              assert.equal(localDate(f.weeks()[1].start), '2026-10-03');
            } finally { f.close(); }
          });
          JS
      - name: Reproduce the missing October 3-9 week before patching
        env:
          NODE_PATH: ${{ runner.temp }}/team-agent-test-deps/node_modules
          TZ: UTC
        run: |
          if node --test --test-name-pattern='^Recorded history:' tests/browser/team-weekly-performance.test.cjs > "$RUNNER_TEMP/history-before.log" 2>&1; then
            cat "$RUNNER_TEMP/history-before.log"
            echo 'Expected the existing activation-only history to fail the new regression.'
            exit 1
          fi
          grep -F 'Recorded history must include October 3-9' "$RUNNER_TEMP/history-before.log"
          tail -n 12 "$RUNNER_TEMP/history-before.log"
      - name: Preserve earlier start dates and recorded lead history without editing HR data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('admin-dashboard.html')
          text = p.read_bytes().decode('utf-8')
          start = text.index('       renderAgentLeads() {')
          end = text.index('        openAgentLeadDrilldown(', start)
          before = text[start:end]
          body = before
          a = body.index('    const activeStartRaw =')
          b = body.index('  // Include the Saturday-Friday week containing the active start date.', a)
          replacement = r'''    const today = new Date();
              today.setHours(23, 59, 59, 999);

              // Weekly performance is lead history, not an HR activation cutoff.
              // Include earlier working/training weeks without changing either HR date.
              const parseStartDate = (raw) => {
                const value = String(raw ?? "").trim();
                if (!value) return null;
                const date = /^\d{4}-\d{2}-\d{2}$/.test(value)
                  ? new Date(value + "T00:00:00")
                  : new Date(value);
                if (isNaN(date.getTime())) return null;
                date.setHours(0, 0, 0, 0);
                return date;
              };
              const startDates = [selectedAgent.start_date, selectedAgent.active_start_date]
                .map(parseStartDate).filter(Boolean);
              let historyStart = startDates.reduce((earliest, date) =>
                !earliest || date < earliest ? date : earliest, null);

              // Use Team's existing official-name resolution, plus the email fallback
              // already supported by the weekly modal, for both the range and counts.
              const agentLeadEntries = leads.flatMap(lead => {
                const rawAgent = this.pick(lead, [
                  "appointment_coordinator_name", "Appointment Coordinator Name",
                  "agent_name", "Agent Name", "AGENT"
                ], "");
                const leadAgent = normalizeAgent(this.getOfficialAgentName(rawAgent));
                const leadEmail = normalizeAgent(this.getLeadField(lead, [
                  "agent_email", "Agent Email", "appointment_coordinator_email"
                ], ""));
                if (leadAgent !== agentKey && (!selectedEmail || leadEmail !== selectedEmail)) return [];
                const date = this.getLeadDateObj(lead);
                return date && !isNaN(date.getTime()) ? [{ lead, date }] : [];
              });
              for (const { date } of agentLeadEntries) {
                // Invalid/future submissions cannot invent an earlier working week.
                if (date <= today && (!historyStart || date < historyStart)) {
                  historyStart = new Date(date);
                }
              }

              if (!historyStart) {
                const hasDate = [selectedAgent.start_date, selectedAgent.active_start_date]
                  .some(value => String(value ?? "").trim());
                weeklyBody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-red-500 italic">${hasDate
                  ? "Invalid active start date. Please check the agent record in HR &amp; Agents."
                  : "Missing active_start_date. No dated lead history is available."}</td></tr>`;
                return;
              }
              historyStart.setHours(0, 0, 0, 0);
              if (historyStart > today) {
                weeklyBody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-500 italic">This agent has not started yet. Weekly performance begins on ${historyStart.toLocaleDateString()}.</td></tr>`;
                return;
              }

          '''
          # Strip the workflow heredoc's common indentation from JS continuation lines.
          replacement = replacement.replace('\n    ', '\n', 0) if False else replacement
          lines = replacement.splitlines()
          # The first line is already indented four spaces; subsequent lines use
          # an extra ten spaces to keep this YAML heredoc readable.
          replacement = '\n'.join([lines[0]] + [line[10:] if line.startswith('          ') else line for line in lines[1:]]) + '\n'
          body = body[:a] + replacement + body[b:]
          body = body.replace('  // Include the Saturday-Friday week containing the active start date.',
                              '  // Include the Saturday-Friday week containing the earliest known activity.')
          assert body.count('let cursor = getSaturdayOnOrBefore(activeStart);') == 1
          body = body.replace('let cursor = getSaturdayOnOrBefore(activeStart);',
                              'let cursor = getSaturdayOnOrBefore(historyStart);')
          a = body.index('    const weekLeads = leads.filter(l => {')
          b = body.index('\n    });', a) + len('\n    });')
          body = body[:a] + '''    const weekLeads = agentLeadEntries
                .filter(({ date }) => date >= weekStart && date <= weekEnd)
                .map(({ lead }) => lead);'''.replace('\n                ', '\n      ') + body[b:]
          assert body != before
          p.write_bytes((text[:start] + body + text[end:]).encode('utf-8'))
          ci = Path('.github/workflows/team-agent-click-checks.yml')
          ci_text = ci.read_text()
          old = 'let cursor = getSaturdayOnOrBefore(activeStart);'
          assert ci_text.count(old) == 1
          ci_text = ci_text.replace(old, 'let cursor = getSaturdayOnOrBefore(historyStart);')
          ci.write_text(ci_text)
          PY
      - name: Test full Team-to-history-to-lead flow in three time zones and all existing regressions
        env:
          NODE_PATH: ${{ runner.temp }}/team-agent-test-deps/node_modules
        run: |
          TZ=UTC node --test tests/browser/*.test.cjs
          TZ=America/New_York node --test tests/browser/team-weekly-performance.test.cjs
          TZ=Asia/Manila node --test tests/browser/team-weekly-performance.test.cjs
          node --test tests/*.test.cjs
          git diff --check
          git diff --stat
          git diff -- admin-dashboard.html
      - name: Commit only the tested repair to its isolated branch
        run: |
          test "$GITHUB_REF" = 'refs/heads/fix/team-history-before-active-20261016'
          git config user.name 'CHL repair checks'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-dashboard.html tests/browser/team-weekly-performance.test.cjs .github/workflows/team-agent-click-checks.yml
          git commit -m 'Preserve Team lead history before an agent activation date'
          git push origin HEAD:refs/heads/fix/team-history-before-active-20261016
