name: One-time payroll dashboard repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-payroll-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch payroll loading logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # ------------------------------------------------------------
          # 1) Shared loader: load current + previous 3 payroll weeks.
          # ------------------------------------------------------------
          main_path = Path('main.js')
          main_text = main_path.read_text(encoding='utf-8')

          query_pattern = re.compile(
              r"// TEMP TEST — CURRENT PAYROLL WEEK ONLY\s*"
              r"supaClient\s*"
              r"\.from\('payroll_weekly_fact_v2'\)\s*"
              r"\.select\('\*'\)\s*"
              r"\.eq\('week_start', payrollCurrentWeekKey\)\s*"
              r"\.order\('week_start', \{ ascending: false \}\),"
          )

          new_query = """// Load current payroll week plus the previous 3 payroll weeks.
          // A new week can legitimately have zero rows, so keeping recent completed
          // weeks in memory prevents Payroll & Finance from booting with an empty set.
          supaClient
            .from('payroll_weekly_fact_v2')
            .select('*')
            .gte('week_start', payrollFourWeekStartKey)
            .lte('week_start', payrollCurrentWeekKey)
            .order('week_start', { ascending: false }),"""

          main_text, count = query_pattern.subn(new_query, main_text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one current-week-only payroll query; found {count}')
          main_path.write_text(main_text, encoding='utf-8')

          # ------------------------------------------------------------
          # 2) Admin payroll: bootstrap latest completed week when empty.
          # ------------------------------------------------------------
          admin_path = Path('admin-dashboard.html')
          admin_text = admin_path.read_text(encoding='utf-8')
          render_start = admin_text.find('async renderPayrollFinance()')
          if render_start < 0:
              raise SystemExit('renderPayrollFinance was not found in admin-dashboard.html')

          render_slice = admin_text[render_start:]
          render_slice, count = re.subn(
              r"(async renderPayrollFinance\(\)\s*\{\s*const state = this\.getState\(\);\s*)const payrollRows",
              r"\1let payrollRows",
              render_slice,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Could not convert payrollRows to let; replacements={count}')
          admin_text = admin_text[:render_start] + render_slice

          render_start = admin_text.find('async renderPayrollFinance()')
          guard_pos = admin_text.find('if (!payrollRows.length) {', render_start)
          if guard_pos < 0:
              raise SystemExit('Empty payroll guard was not found')

          bootstrap = """// If the new/current payroll week has no rows yet, bootstrap the
          // latest completed payroll week instead of leaving the UI on \"Loading Weeks...\".
          if (!payrollRows.length && typeof this.loadPayrollWeekList === \"function\") {
            try {
              const bootstrapWeeks = await this.loadPayrollWeekList();
              const todayKey = new Date().toISOString().slice(0, 10);
              const bootstrapWeek =
                bootstrapWeeks.find(w => String(w.week_end || \"\") < todayKey) ||
                bootstrapWeeks.find(w => String(w.week_start || \"\") <= todayKey) ||
                bootstrapWeeks[0];

              if (bootstrapWeek?.week_id) {
                this._payrollRequestedWeekId = String(bootstrapWeek.week_id);
                await this.loadPayrollWeek(
                  String(bootstrapWeek.week_id),
                  bootstrapWeek.week_start || null
                );

                payrollRows = Array.isArray(state.payrollWeeklyFactView)
                  ? state.payrollWeeklyFactView
                  : [];
              }
            } catch (bootstrapError) {
              console.error(\"Payroll bootstrap load failed:\", bootstrapError);
            }
          }

          """
          admin_text = admin_text[:guard_pos] + bootstrap + admin_text[guard_pos:]

          # Prefer the latest week that actually has payroll rows instead of
          # defaulting to a brand-new empty current week.
          render_start = admin_text.find('async renderPayrollFinance()')
          render_end = admin_text.find('async savePayrollLedgerStatus(', render_start)
          if render_end < 0:
              raise SystemExit('Could not find end boundary for renderPayrollFinance')

          before = admin_text[:render_start]
          render_block = admin_text[render_start:render_end]
          after = admin_text[render_end:]

          default_pattern = re.compile(
              r"if \(uniqueWeeks\.some\(w => w\.week_id === currentValue\)\) \{\s*"
              r"weekSelect\.value = currentValue;\s*"
              r"\} else if \(uniqueWeeks\[0\]\) \{\s*"
              r"weekSelect\.value = uniqueWeeks\[0\]\.week_id;\s*"
              r"\}"
          )

          new_default = """const latestLoadedWeekId = payrollRows
              .filter(r => r.week_id && r.week_start)
              .slice()
              .sort((a, b) => String(b.week_start).localeCompare(String(a.week_start)))[0]?.week_id;

            if (uniqueWeeks.some(w => w.week_id === currentValue)) {
              weekSelect.value = currentValue;
            } else if (
              latestLoadedWeekId &&
              uniqueWeeks.some(w => w.week_id === String(latestLoadedWeekId))
            ) {
              weekSelect.value = String(latestLoadedWeekId);
            } else if (uniqueWeeks[0]) {
              weekSelect.value = uniqueWeeks[0].week_id;
            }"""

          render_block, count = default_pattern.subn(new_default, render_block, count=1)
          if count != 1:
              raise SystemExit(f'Payroll default-week block replacement failed; replacements={count}')

          admin_text = before + render_block + after
          admin_path.write_text(admin_text, encoding='utf-8')

          print('Payroll dashboard files patched successfully.')
          PY

      - name: Validate shared JavaScript syntax
        run: node --check main.js

      - name: Verify expected payroll fix markers
        shell: bash
        run: |
          grep -q "gte('week_start', payrollFourWeekStartKey)" main.js
          grep -q "Payroll bootstrap load failed" admin-dashboard.html
          grep -q "latestLoadedWeekId" admin-dashboard.html

      - name: Remove one-time repair workflow
        run: rm .github/workflows/payroll-dashboard-fix.yml

      - name: Commit payroll fix
        shell: bash
        run: |
          git config user.name "CHL Payroll Repair"
          git config user.email "actions@users.noreply.github.com"
          git add main.js admin-dashboard.html .github/workflows/payroll-dashboard-fix.yml
          git commit -m "Fix payroll week loading on dashboard"
          git push origin main
