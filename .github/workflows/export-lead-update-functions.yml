name: Export lead mutation functions

on:
  push:
    branches:
      - feat/leads-review-modal
    paths:
      - .github/workflows/export-lead-update-functions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/leads-review-modal
          fetch-depth: 1

      - name: Extract mutation function contexts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          terms = [
              'handleLeadStatusChange', 'updateLeadStatus', 'updateLeadFeedback',
              'deleteLead', 'leads_raw', 'feedback_highlight', 'rejection_reason',
              'const supaClient', 'let supaClient', 'var supaClient'
          ]

          Path('.inspection').mkdir(exist_ok=True)
          for filename in ('admin-dashboard.html', 'management-dashboard.html'):
              lines = Path(filename).read_text(encoding='utf-8').splitlines()
              ranges = []
              hits = []
              for i, line in enumerate(lines, 1):
                  for term in terms:
                      if term.lower() in line.lower():
                          hits.append((i, term, line))
                          ranges.append((max(1, i-85), min(len(lines), i+150)))
              ranges.sort()
              merged = []
              for start, end in ranges:
                  if not merged or start > merged[-1][1] + 5:
                      merged.append([start, end])
                  else:
                      merged[-1][1] = max(merged[-1][1], end)

              out = [f'# {filename} lead mutation contexts']
              out.append('\n# Hit index')
              out.extend(f'{i:05d}: {term}: {line}' for i, term, line in hits)
              for start, end in merged:
                  out.append(f'\n## Lines {start}-{end}')
                  out.extend(f'{i:05d}: {lines[i-1]}' for i in range(start, end+1))

              stem = Path(filename).stem.replace('-dashboard', '')
              Path(f'.inspection/{stem}-lead-mutations.txt').write_text('\n'.join(out), encoding='utf-8')
          PY

      - name: Commit excerpts
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .inspection/*-lead-mutations.txt
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: export lead mutation contexts"
            git push origin HEAD:feat/leads-review-modal
          fi
