name: Targeted Aug 29 payroll repair

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-payroll:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch targeted roster and one-week six-appointment bonus
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('admin-dashboard.html')
          text = path.read_text(encoding='utf-8')

          old_roster = '''          const selectedWeekMeta = uniqueWeeks.find(w => w.week_id === selectedWeekId);\n          const selectedRows = payrollRows.filter(r => String(r.week_id) === selectedWeekId);\n  \n          this._currentPayrollRows = selectedRows;'''

          new_roster = '''          const selectedWeekMeta = uniqueWeeks.find(w => w.week_id === selectedWeekId);\n          const selectedRows = payrollRows.filter(r => String(r.week_id) === selectedWeekId);\n\n          // Targeted payroll roster inclusion beginning Aug 29, 2026.\n          // Only these three workers are added when the fact view has not yet\n          // materialized their row. Do not broaden this to the full worker roster.\n          if (selectedWeekMeta?.week_start && String(selectedWeekMeta.week_start).slice(0, 10) >= \"2026-08-29\") {\n            const normalizePayrollName = value => String(value || \"\")\n              .trim()\n              .toLowerCase()\n              .replace(/[^a-z]/g, \"\");\n\n            const targetedNames = new Set([\n              \"davidnathaniel\",\n              \"micaellabarrot\",\n              \"reychellebarrot\"\n            ]);\n\n            const weekStartKey = String(selectedWeekMeta.week_start).slice(0, 10);\n            const weekEndKey = String(selectedWeekMeta.week_end || \"\").slice(0, 10);\n            const selectedWorkerIds = new Set(\n              selectedRows.map(row => String(row.worker_id || \"\").trim()).filter(Boolean)\n            );\n\n            const targetedWorkers = workers.filter(worker => {\n              const nameKey = normalizePayrollName(worker.display_name || worker.agent_name_key);\n              if (!targetedNames.has(nameKey)) return false;\n              if (worker.show_in_payroll === false || worker.is_active === false) return false;\n\n              const start = worker.employment_start_date ? String(worker.employment_start_date).slice(0, 10) : null;\n              const end = worker.employment_end_date ? String(worker.employment_end_date).slice(0, 10) : null;\n              if (start && start > weekStartKey) return false;\n              if (end && end < weekStartKey) return false;\n              return true;\n            });\n\n            const missingIds = targetedWorkers\n              .map(worker => String(worker.id || \"\").trim())\n              .filter(workerId => workerId && !selectedWorkerIds.has(workerId));\n\n            if (missingIds.length && typeof supaClient !== \"undefined\" && supaClient) {\n              try {\n                const { data: targetBaseRows, error: targetBaseError } = await supaClient\n                  .from(\"payroll_weekly_base_view\")\n                  .select(\"*\")\n                  .eq(\"week_start\", weekStartKey)\n                  .in(\"worker_id\", missingIds);\n\n                if (targetBaseError) {\n                  console.warn(\"Targeted payroll base lookup failed:\", targetBaseError);\n                } else {\n                  (targetBaseRows || []).forEach(baseRow => {\n                    const workerId = String(baseRow.worker_id || \"\").trim();\n                    if (!workerId || selectedWorkerIds.has(workerId)) return;\n                    const worker = targetedWorkers.find(w => String(w.id || \"\") === workerId) || {};\n                    const displayName = String(baseRow.display_name || worker.display_name || worker.agent_name_key || \"Unknown\").trim();\n                    const isDavid = normalizePayrollName(displayName) === \"davidnathaniel\";\n                    const mergedRow = {\n                      ...baseRow,\n                      week_id: selectedWeekId,\n                      week_start: weekStartKey,\n                      week_end: baseRow.week_end || weekEndKey,\n                      display_name: displayName,\n                      country: isDavid ? \"UNITED STATES\" : (worker.country || baseRow.country || \"UNASSIGNED\")\n                    };\n                    selectedRows.push(mergedRow);\n                    payrollRows.push(mergedRow);\n                    selectedWorkerIds.add(workerId);\n                  });\n                }\n              } catch (targetBaseException) {\n                console.warn(\"Targeted payroll base lookup exception:\", targetBaseException);\n              }\n            }\n\n            // If the weekly base view also has not materialized a row yet, create\n            // a zero-hour row for only the three explicitly targeted workers.\n            targetedWorkers.forEach(worker => {\n              const workerId = String(worker.id || \"\").trim();\n              if (!workerId || selectedWorkerIds.has(workerId)) return;\n              const displayName = String(worker.display_name || worker.agent_name_key || \"Unknown\").trim();\n              const isDavid = normalizePayrollName(displayName) === \"davidnathaniel\";\n              const syntheticRow = {\n                week_id: selectedWeekId,\n                week_start: weekStartKey,\n                week_end: weekEndKey,\n                worker_id: workerId,\n                worker_email: worker.email || \"\",\n                display_name: displayName,\n                country: isDavid ? \"UNITED STATES\" : (worker.country || \"UNASSIGNED\"),\n                effective_rate: Number(worker.default_rate || 0),\n                total_hours: 0,\n                adjusted_hours: 0,\n                manual_hours_delta: 0,\n                base_pay: 0,\n                approved_leads: 0,\n                rejected_leads: 0,\n                total_leads: 0,\n                manual_incentive_delta: 0,\n                is_paid: false,\n                locked: false,\n                note: \"\",\n                approved_by: \"\",\n                hours_sat: 0, hours_sun: 0, hours_mon: 0, hours_tue: 0,\n                hours_wed: 0, hours_thu: 0, hours_fri: 0\n              };\n              selectedRows.push(syntheticRow);\n              payrollRows.push(syntheticRow);\n              selectedWorkerIds.add(workerId);\n            });\n          }\n  \n          this._currentPayrollRows = selectedRows;'''

          if old_roster not in text:
              raise SystemExit('Selected payroll row block not found')
          text = text.replace(old_roster, new_roster, 1)

          old_bonus = '''  // One-week payroll exception: Shady Magdy's Aug 22-28, 2026\n  // incentive is entered manually, so suppress the automatic tier bonus\n  // without changing his lead counts or any other payroll week.\n  const suppressAutoBonus =\n    agName.toLowerCase() === \"shady magdy\" &&\n    String(r.week_start || \"\") === \"2026-08-22\";\n\n  const autoBonus = suppressAutoBonus\n    ? 0\n    : this.calculateTieredBonus(approvedLeads, creditedLeads);'''

          new_bonus = '''  // One-week payroll exceptions.\n  const normalizedPayrollName = agName.toLowerCase().replace(/[^a-z]/g, \"\");\n  const payrollWeekKey = String(r.week_start || \"\").slice(0, 10);\n\n  // Shady Magdy: Aug 22-28 bonus is entered manually.\n  const suppressShadyAutoBonus =\n    normalizedPayrollName === \"shadymagdy\" &&\n    payrollWeekKey === \"2026-08-22\";\n\n  // Aug 29-Sep 4 only: exactly 6 qualified appointments should not\n  // receive the normal $50 automatic tier bonus. Lead counts remain intact.\n  const suppressSixQualifiedBonus =\n    payrollWeekKey === \"2026-08-29\" &&\n    approvedLeads === 6;\n\n  const autoBonus = (suppressShadyAutoBonus || suppressSixQualifiedBonus)\n    ? 0\n    : this.calculateTieredBonus(approvedLeads, creditedLeads);'''

          if old_bonus not in text:
              raise SystemExit('Existing Shady bonus block not found')
          text = text.replace(old_bonus, new_bonus, 1)

          path.write_text(text, encoding='utf-8')
          print('Targeted Aug 29 payroll repair applied.')
          PY

      - name: Verify targeted changes
        shell: bash
        run: |
          grep -q 'targetedNames' admin-dashboard.html
          grep -q 'davidnathaniel' admin-dashboard.html
          grep -q 'micaellabarrot' admin-dashboard.html
          grep -q 'reychellebarrot' admin-dashboard.html
          grep -q 'suppressSixQualifiedBonus' admin-dashboard.html
          grep -q 'approvedLeads === 6' admin-dashboard.html

      - name: Remove one-time workflow
        run: rm .github/workflows/payroll-0829-targeted-fix.yml

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "CHL Payroll Repair"
          git config user.email "actions@users.noreply.github.com"
          git add admin-dashboard.html .github/workflows/payroll-0829-targeted-fix.yml
          git commit -m "Target Aug 29 payroll roster and bonus rule"
          git push origin main
