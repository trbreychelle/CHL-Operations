name: Apply tested Team history repair
on:
  push:
    branches: [fix/team-history-before-active-20261016]
    paths: ['.github/workflows/team-history-apply-once.yml']
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/fix/team-history-before-active-20261016'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated DOM test dependencies
        run: npm install --prefix "$RUNNER_TEMP/team-agent-test-deps" --ignore-scripts --no-audit --no-fund acorn@8.14.1 jsdom@24.1.3
      - name: Reuse the reviewed application patch and regression cases only
        run: |
          test "$(git hash-object admin-dashboard.html)" = 'fc9a22d77a10f458adaa3b335c1b4264b9c55709'
          python3 - <<'PY'
          from pathlib import Path
          import os
          import textwrap
          source = Path('.github/workflows/team-history-repair-once.yml').read_text()
          def script_for(name):
              start = source.index('      - name: ' + name + '\n')
              rest = source[start:].split('        run: |\n', 1)[1]
              block = rest.split('\n      - name:', 1)[0]
              return textwrap.dedent(block).rstrip() + '\n'
          tests = script_for('Add regression cases for recorded leads before activation')
          patch = script_for('Preserve earlier start dates and recorded lead history without editing HR data')
          # Workflow changes must use the authorized GitHub connector separately,
          # not the narrower contents-only Actions token.
          cut = patch.index("ci = Path('.github/workflows/team-agent-click-checks.yml')")
          patch = patch[:cut] + 'PY\n'
          temp = Path(os.environ['RUNNER_TEMP'])
          (temp / 'append-history-tests.sh').write_text(tests)
          (temp / 'apply-history-patch.sh').write_text(patch)
          PY
          bash "$RUNNER_TEMP/append-history-tests.sh"
      - name: Confirm the original reported history regression
        env:
          NODE_PATH: ${{ runner.temp }}/team-agent-test-deps/node_modules
          TZ: UTC
        run: |
          if node --test --test-name-pattern='^Recorded history:' tests/browser/team-weekly-performance.test.cjs > "$RUNNER_TEMP/history-before.log" 2>&1; then
            echo 'Expected the original earlier-week regression.'
            exit 1
          fi
          grep -F 'Recorded history must include October 3-9' "$RUNNER_TEMP/history-before.log"
          bash "$RUNNER_TEMP/apply-history-patch.sh"
      - name: Test the complete repair and all regressions
        env:
          NODE_PATH: ${{ runner.temp }}/team-agent-test-deps/node_modules
        run: |
          TZ=UTC node --test tests/browser/*.test.cjs
          TZ=America/New_York node --test tests/browser/team-weekly-performance.test.cjs
          TZ=Asia/Manila node --test tests/browser/team-weekly-performance.test.cjs
          node --test tests/*.test.cjs
          git diff --check
      - name: Commit application and test files only
        run: |
          test "$GITHUB_REF" = 'refs/heads/fix/team-history-before-active-20261016'
          git config user.name 'CHL repair checks'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin-dashboard.html tests/browser/team-weekly-performance.test.cjs
          test "$(git diff --cached --name-only | wc -l)" -eq 2
          if git diff --cached --name-only | grep -q '^.github/'; then exit 1; fi
          git commit -m 'Preserve Team lead history before an agent activation date'
          git push origin HEAD:refs/heads/fix/team-history-before-active-20261016
