<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>CHL payroll query checks</title><style>body{font:15px/1.5 system-ui;max-width:1050px;margin:30px auto;padding:20px}textarea{width:100%;height:260px;font:12px/1.4 monospace}button{padding:12px 18px;margin:15px 0 35px;font:inherit}</style></head><body><h1>Old payroll: bounded query checks</h1><p>The baseline is read-only. The candidate comparison creates temporary views only, compares complete results, and rolls back. No production records or definitions are changed.</p><form method="post" action="https://supabase.callhammerleads.com/api/platform/pg-meta/default/query"><h2>1. Baseline</h2><textarea name="query" readonly>BEGIN READ ONLY;
SET LOCAL statement_timeout='40s';
DO $check$
DECLARE p json; started timestamptz:=clock_timestamp();
BEGIN
 BEGIN
 EXECUTE 'EXPLAIN (ANALYZE, BUFFERS, TIMING OFF, FORMAT JSON) SELECT * FROM public.payroll_weekly_fact_v2 WHERE week_id=''56485693-b922-47f7-a602-1a1e262ae42c''::uuid' INTO p;
 PERFORM set_config('chl.payroll_baseline',jsonb_build_object('elapsed_ms',1000*extract(epoch from clock_timestamp()-started),'execution_ms',p->0->'Execution Time','planning_ms',p->0->'Planning Time','rows',p->0->'Plan'->'Actual Rows','total_cost',p->0->'Plan'->'Total Cost','jit',p->0->'JIT')::text,true);
 EXCEPTION WHEN query_canceled THEN PERFORM set_config('chl.payroll_baseline',jsonb_build_object('error',SQLERRM,'code',SQLSTATE,'elapsed_ms',1000*extract(epoch from clock_timestamp()-started))::text,true);
 WHEN OTHERS THEN PERFORM set_config('chl.payroll_baseline',jsonb_build_object('error',SQLERRM,'code',SQLSTATE)::text,true);
 END;
END $check$;
SELECT jsonb_build_object('baseline',current_setting('chl.payroll_baseline',true)::jsonb,'normalizer',(SELECT jsonb_agg(jsonb_build_object('definition',pg_get_functiondef(p.oid),'volatility',p.provolatile)) FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname='normalize_agent_name'),'definition_hashes',(SELECT jsonb_object_agg(c.relname,md5(pg_get_viewdef(c.oid,true))) FROM pg_class c JOIN pg_namespace n ON n.oid=c.relnamespace WHERE n.nspname='public' AND c.relname IN ('payroll_weekly_fact_v2','payroll_time_events_view','payroll_leads_weekly')),'date_types',(SELECT jsonb_agg(jsonb_build_object('table',table_name,'column',column_name,'type',data_type)) FROM information_schema.columns WHERE table_schema='public' AND (table_name='time_events' AND column_name IN ('id','occurred_at','occurred_at_ts') OR table_name='leads_raw' AND column_name IN ('id','date_submitted')))) AS baseline_report;
COMMIT;</textarea><br><button type="submit">Run bounded baseline</button></form><form method="post" action="https://supabase.callhammerleads.com/api/platform/pg-meta/default/query"><h2>2. Exact candidate comparison (rolled back)</h2><textarea name="query" readonly>BEGIN;
SET LOCAL statement_timeout='50s';
SET LOCAL lock_timeout='2s';
DO $candidate$
DECLARE original_time text; original_leads text; original_fact text; tail_at int; new_time text; new_leads text; new_fact text; a bigint; b bigint; mismatch bigint; p json; info jsonb:='{}'::jsonb; started timestamptz;
BEGIN
 original_time:=pg_get_viewdef('public.payroll_time_events_view'::regclass,true);
 original_leads:=pg_get_viewdef('public.payroll_leads_weekly'::regclass,true);
 original_fact:=pg_get_viewdef('public.payroll_weekly_fact_v2'::regclass,true);
 tail_at:=strpos(original_time,'ordered_events AS (');
 IF tail_at=0 THEN RAISE EXCEPTION 'Unexpected time view; no changes'; END IF;
 new_time:=$time$WITH matched_events AS (
 SELECT te.id AS source_event_id,pw.id AS worker_id,pw.display_name,pw.email AS worker_email,te.occurred_at::timestamptz AS occurred_at_ts,te.action
 FROM public.time_events te JOIN public.payroll_workers pw ON lower(trim(te.agent_email))=lower(trim(pw.email))
 WHERE coalesce(pw.show_in_payroll,true)=true AND coalesce(pw.is_active,true)=true
 UNION
 SELECT te.id AS source_event_id,pw.id AS worker_id,pw.display_name,pw.email AS worker_email,te.occurred_at::timestamptz AS occurred_at_ts,te.action
 FROM public.time_events te JOIN public.payroll_worker_aliases pwa ON lower(trim(te.agent_name))=lower(trim(pwa.alias_key)) JOIN public.payroll_workers pw ON pw.id=pwa.worker_id
 WHERE coalesce(pw.show_in_payroll,true)=true AND coalesce(pw.is_active,true)=true
), $time$||substring(original_time FROM tail_at);
 tail_at:=strpos(original_leads,' SELECT matched_leads.week_id');
 IF tail_at=0 THEN RAISE EXCEPTION 'Unexpected leads view; no changes'; END IF;
 new_leads:=$leads$WITH worker_names AS MATERIALIZED (
 SELECT pw.id AS worker_id,public.normalize_agent_name(pw.display_name) AS agent_key FROM public.payroll_workers pw WHERE coalesce(pw.show_in_payroll,true)=true AND coalesce(pw.is_active,true)=true
 UNION
 SELECT pw.id AS worker_id,public.normalize_agent_name(pwa.alias_key) AS agent_key FROM public.payroll_workers pw JOIN public.payroll_worker_aliases pwa ON pwa.worker_id=pw.id WHERE coalesce(pw.show_in_payroll,true)=true AND coalesce(pw.is_active,true)=true
), matched_leads AS (
 SELECT w.id AS week_id,wn.worker_id,lr.status FROM public.payroll_weeks w JOIN public.leads_raw lr ON lr.date_submitted>=w.week_start AND lr.date_submitted<=w.week_end JOIN worker_names wn ON wn.agent_key=public.normalize_agent_name(lr.appointment_coordinator_name)
) $leads$||substring(original_leads FROM tail_at);
 EXECUTE 'CREATE TEMP VIEW chl_time_candidate AS '||new_time;
 EXECUTE 'CREATE TEMP VIEW chl_leads_candidate AS '||new_leads;
 new_fact:=replace(replace(original_fact,'payroll_time_events_view','pg_temp.chl_time_candidate'),'payroll_leads_weekly','pg_temp.chl_leads_candidate');
 EXECUTE 'CREATE TEMP VIEW chl_fact_candidate AS '||new_fact;
 started:=clock_timestamp();
 EXECUTE 'EXPLAIN (ANALYZE, BUFFERS, TIMING OFF, FORMAT JSON) SELECT * FROM pg_temp.chl_fact_candidate WHERE week_id=''56485693-b922-47f7-a602-1a1e262ae42c''::uuid' INTO p;
 info:=jsonb_build_object('candidate_execution_ms',p->0->'Execution Time','candidate_planning_ms',p->0->'Planning Time','candidate_rows',p->0->'Plan'->'Actual Rows','candidate_elapsed_ms',1000*extract(epoch from clock_timestamp()-started));
 BEGIN
 started:=clock_timestamp();
 WITH old_rows AS MATERIALIZED (SELECT * FROM public.payroll_time_events_view),new_rows AS MATERIALIZED (SELECT * FROM pg_temp.chl_time_candidate),diff AS ((SELECT * FROM old_rows EXCEPT ALL SELECT * FROM new_rows) UNION ALL (SELECT * FROM new_rows EXCEPT ALL SELECT * FROM old_rows)) SELECT (SELECT count(*) FROM old_rows),(SELECT count(*) FROM new_rows),(SELECT count(*) FROM diff) INTO a,b,mismatch;
 info:=info||jsonb_build_object('time_old_rows',a,'time_new_rows',b,'time_mismatches',mismatch,'time_comparison_ms',1000*extract(epoch from clock_timestamp()-started));
 WITH old_rows AS MATERIALIZED (SELECT * FROM public.payroll_leads_weekly),new_rows AS MATERIALIZED (SELECT * FROM pg_temp.chl_leads_candidate),diff AS ((SELECT * FROM old_rows EXCEPT ALL SELECT * FROM new_rows) UNION ALL (SELECT * FROM new_rows EXCEPT ALL SELECT * FROM old_rows)) SELECT (SELECT count(*) FROM old_rows),(SELECT count(*) FROM new_rows),(SELECT count(*) FROM diff) INTO a,b,mismatch;
 info:=info||jsonb_build_object('leads_old_rows',a,'leads_new_rows',b,'leads_mismatches',mismatch);
 WITH old_rows AS MATERIALIZED (SELECT * FROM public.payroll_weekly_fact_v2 WHERE week_id='56485693-b922-47f7-a602-1a1e262ae42c'::uuid),new_rows AS MATERIALIZED (SELECT * FROM pg_temp.chl_fact_candidate WHERE week_id='56485693-b922-47f7-a602-1a1e262ae42c'::uuid),diff AS ((SELECT * FROM old_rows EXCEPT ALL SELECT * FROM new_rows) UNION ALL (SELECT * FROM new_rows EXCEPT ALL SELECT * FROM old_rows)) SELECT (SELECT count(*) FROM old_rows),(SELECT count(*) FROM new_rows),(SELECT count(*) FROM diff) INTO a,b,mismatch;
 info:=info||jsonb_build_object('payroll_old_rows',a,'payroll_new_rows',b,'payroll_mismatches',mismatch);
 EXCEPTION WHEN query_canceled THEN info:=info||jsonb_build_object('comparison_error',SQLERRM,'comparison_code',SQLSTATE); WHEN OTHERS THEN info:=info||jsonb_build_object('comparison_error',SQLERRM,'comparison_code',SQLSTATE); END;
 PERFORM set_config('chl.payroll_candidate',info::text,true);
END $candidate$;
SELECT current_setting('chl.payroll_candidate',true)::jsonb AS candidate_report;
ROLLBACK;</textarea><br><button type="submit">Compare candidate without changing production</button></form></body></html>
